repos:
  # -------------------------------------------------
  # BANDIT SECURITY SCAN
  # -------------------------------------------------
  - repo: local
    hooks:
      - id: bandit-security-scan
        name: Bandit Security Scan
        entry: python -m bandit
        language: system
        types: [python]
        args:
          - "-r"
          - "."
          - "--severity-level"
          - "high"
        pass_filenames: false

  # -------------------------------------------------
  # SEMGREP CUSTOM SECURITY POLICY
  # -------------------------------------------------
  - repo: https://github.com/semgrep/semgrep
    rev: v1.137.0
    hooks:
      - id: semgrep
        name: Semgrep Custom Security Policy
        args:
          - "--config=.semgrep/custom-python-rules.yml"

  # -------------------------------------------------
  # PHASE 5 - PRE-COMMIT SECRET SCANNING
  # -------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect Secrets
        args:
          - "--baseline"
          - ".secrets.baseline"