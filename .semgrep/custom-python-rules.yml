rules:
  # -------------------------------------------------
  # BINCOM CUSTOM PYTHON SECURITY POLICIES
  # PHASE 4 RULES
  # -------------------------------------------------

  - id: bincom-no-eval
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: eval() is prohibited because it can execute untrusted code."
    pattern: eval(...)

  - id: bincom-no-exec
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: exec() is prohibited because it can execute arbitrary code."
    pattern: exec(...)

  - id: bincom-no-credential-logging
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: Do not expose passwords, tokens, API keys, or secrets in application logs."
    patterns:
      - pattern: logging.$LEVEL($MESSAGE)
      - metavariable-regex:
          metavariable: $MESSAGE
          regex: '(?i).*(password|passwd|token|api[_ -]?key|secret|credential).*'

  - id: bincom-use-secrets-not-random
    languages:
      - python
    severity: WARNING
    message: "Bincom Security Policy: Use the secrets module instead of random for security-sensitive random values."
    pattern-either:
      - pattern: random.choice(...)
      - pattern: random.choices(...)
      - pattern: random.randint(...)
      - pattern: random.randrange(...)
      - pattern: random.random(...)

  # -------------------------------------------------
  # PHASE 5 - WEB/API FRAMEWORK SECURITY POLICIES
  # -------------------------------------------------

  - id: bincom-flask-debug-enabled
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: Flask debug mode must not be enabled in production."
    pattern: $APP.run(..., debug=True, ...)

  - id: bincom-flask-cors-wildcard
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: Wildcard CORS origins are prohibited. Restrict access to trusted origins."
    pattern: CORS(..., origins="*", ...)

  - id: bincom-csrf-disabled
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: CSRF protection must not be disabled."
    pattern-either:
      - pattern: $APP.config["WTF_CSRF_ENABLED"] = False
      - pattern: $APP.config['WTF_CSRF_ENABLED'] = False

  - id: bincom-raw-sql-string-format
    languages:
      - python
    severity: ERROR
    message: "Bincom Security Policy: Do not construct SQL queries using string formatting. Use parameterized queries."
    pattern-either:
      - pattern: $CURSOR.execute($QUERY % $VALUE)
      - pattern: $CURSOR.execute($QUERY.format(...))
      - pattern: $CURSOR.execute(f"...")