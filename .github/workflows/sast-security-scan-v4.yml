name: Phase 4 - Supply Chain Hardened SAST and SCA

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # SUPPLY CHAIN HARDENED ACTIONS
      # All third-party actions are pinned to immutable
      # 40-character commit SHAs.
      # -------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # -------------------------------------------------
      # INSTALL SECURITY SCANNING TOOLS
      # -------------------------------------------------

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[sarif]==1.9.4"
          python -m pip install semgrep
          python -m pip install pip-audit

      # -------------------------------------------------
      # BANDIT SAST + SARIF
      # Exclude the intentional Semgrep policy test file
      # from Bandit because it contains deliberately
      # insecure code used to validate custom rules.
      # -------------------------------------------------

      - name: Run Bandit SAST (SARIF Output)
        run: |
          bandit -r . \
            --exclude ./semgrep-policy-test.py \
            -f sarif \
            -o bandit-results.sarif || true

      - name: Upload Bandit SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      # -------------------------------------------------
      # BANDIT HARD SECURITY GATE
      # -------------------------------------------------

      - name: Enforce Bandit SAST security gate
        shell: bash
        run: |
          set +e

          bandit -r . \
            --exclude ./semgrep-policy-test.py \
            --severity-level high
          high_severity=$?

          bandit -r . \
            --exclude ./semgrep-policy-test.py \
            --confidence-level high
          high_confidence=$?

          set -e

          if [ "$high_severity" -ne 0 ] || [ "$high_confidence" -ne 0 ]; then
            echo "SAST gate failed: High-severity or High-confidence Bandit finding detected."
            exit 1
          fi

          echo "Bandit SAST gate passed."

      # -------------------------------------------------
      # SEMGREP DEEP SAST + CUSTOM ENTERPRISE POLICY
      # -------------------------------------------------

      - name: Run Semgrep Deep SAST
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config .semgrep/custom-python-rules.yml \
            --sarif \
            --output semgrep-results.sarif \
            . || true

      - name: Upload Semgrep SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # -------------------------------------------------
      # SOFTWARE COMPOSITION ANALYSIS - PIP-AUDIT
      # -------------------------------------------------

      - name: Generate dependency vulnerability report
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-results.json || true

      - name: Enforce dependency security gate
        run: |
          pip-audit -r requirements.txt

      # -------------------------------------------------
      # UPLOAD REPORTS AS WORKFLOW ARTIFACTS
      # -------------------------------------------------

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase4-security-reports
          path: |
            bandit-results.sarif
            semgrep-results.sarif
            pip-audit-results.json