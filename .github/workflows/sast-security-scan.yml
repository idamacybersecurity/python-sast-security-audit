name: SAST Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bandit-sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Generate Bandit report
        run: |
          bandit -r . -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Enforce SAST security gate
        shell: bash
        run: |
          set +e

          bandit -r . --severity-level high
          high_severity=$?

          bandit -r . --confidence-level high
          high_confidence=$?

          set -e

          if [ "$high_severity" -ne 0 ] || [ "$high_confidence" -ne 0 ]; then
            echo "SAST gate failed: High-severity or High-confidence finding detected."
            exit 1
          fi

          echo "SAST gate passed."

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bandit-report
          path: bandit-report.txt